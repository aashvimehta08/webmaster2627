
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Sign Up</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div id="topSection">
        <h1 id="webText">BRAINGAINZ.EDU</h1>
        <button id="sourcesButton" type="button" onclick="window.location.href='sources.html'">REFERENCES</button>
        <button id="homeButton" type="button" onclick="window.location.href='index.html'">HOME</button>
    </div>

    <h1 id="pageTitle">
        <span id="loginTitle">Login</span>
        <span id="orTitle">or</span>
        <span id="signupTitle">Sign Up!</span>
    </h1>

    <div class="formContainer">
        <p id="signedInPanel" class="formMessage" hidden>
            Logged in as <strong id="signedInEmail"></strong>.
            <a href="modules.html" class="linkButton">Go to modules</a> ·
            <button id="logoutButton" type="button" class="linkButton">Log out</button>
        </p>
        <form id="loginForm" class="formSection" novalidate>
            <label for="loginEmail">Email:</label>
            <input
                type="email"
                id="loginEmail"
                autocomplete="email"
                placeholder="example@email.com"
                required
            >
            <label for="loginPassword">Password:</label>
            <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                required
            >
            <button id="forgotPasswordButton" type="button" class="linkButton">Forgot password?</button>
            <p id="loginMessage" class="formMessage" role="status" aria-live="polite"></p>
            <button
                class="formButton loginButton"
                type="submit">
                LOGIN
            </button>
        </form>
        <div class="divider">
            <span></span>
            <h2>NO ACCOUNT? NO WORRIES!<br>SIGN UP BELOW:</h2>
            <span></span>
        </div>
        <form id="signupForm" class="formSection" novalidate>
            <label for="signupName">Display name:</label>
            <input
                type="text"
                id="signupName"
                autocomplete="nickname"
                maxlength="50"
                placeholder="What should we call you?"
                required
            >
            <label for="signupEmail">Email:</label>
            <input
                type="email"
                id="signupEmail"
                autocomplete="email"
                placeholder="example@email.com"
                required
            >
            <label for="signupPassword">Password:</label>
            <input
                type="password"
                id="signupPassword"
                autocomplete="new-password"
                aria-describedby="passwordHint"
                required
            >
            <p id="passwordHint" class="formHint">At least 8 characters, with at least one letter and one number.</p>
            <label for="signupConfirmPassword">Confirm password:</label>
            <input
                type="password"
                id="signupConfirmPassword"
                autocomplete="new-password"
                required
            >
            <p id="signupMessage" class="formMessage" role="status" aria-live="polite"></p>
            <button
                class="formButton signupButton"
                type="submit">
                CONTINUE TO SIGN-UP
            </button>
        </form>
    </div>
    <footer>
        <div id="footerSection">
          <div id="contactUsSection">
            <h2 id="footerTitle" class="footerText">CONTACT US</h2>
            <p id="phoneNumber" class="footerText footerInfo">720-515-7839</p>
            <p id="email" class="footerText footerInfo">brAln.gainz@gmail.com</p>
          </div>
          <div id="socialsSection">
            <div id="faceboockCircle" class="social top">
              <img id="facebookIcon" class="socialIcon" src="facebook.png">
            </div>
            <div id="instagramCircle" class="social left">
              <img id="instagramIcon" class="socialIcon" src="instagram.png">
            </div>
            <div id="twitterCircle" class="social right">
              <img id="twitterIcon" class="socialIcon" src="twitter-alt.png">
            </div>
            <div id="linkedinCircle" class="social bottom">
              <img id="linkedinIcon" class="socialIcon" src="linkedin.png">
            </div>
          </div>
          <div id="logoSection">
            <img id="footerLogo" src="logo.png" alt="logo">
          </div>
        </div>
      </footer>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
