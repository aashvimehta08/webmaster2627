
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Sign Up</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div id="topSection">
        <h1 id="webText">BRAINGAINZ.EDU</h1>
        <button id="sourcesButton" type="button" onclick="window.location.href='sources.html'">REFERENCES</button>
        <button id="homeButton" type="button" onclick="window.location.href='home.html'">HOME</button>
    </div>

    <h1 id="pageTitle">
        <span id="loginTitle">Login</span>
        <span id="orTitle">or</span>
        <span id="signupTitle">Sign Up!</span>
    </h1>

    <div class="formContainer">
        <div class="formSection">
            <label for="loginEmail">Email or username:</label>
            <input
                type="text"
                id="loginEmail"
                placeholder="example@email.com"
            >
            <label for="loginPassword">Password:</label>
            <input
                type="password"
                id="loginPassword"
            >
            <button
                class="formButton loginButton"
                type="button"
                onclick="window.location.href='modules.html'">
                LOGIN
            </button>
        </div>
        <div class="divider">
            <span></span>
            <h2>NO ACCOUNT? NO WORRIES!<br>SIGN UP BELOW:</h2>
            <span></span>
        </div>
        <div class="formSection">
            <label for="signupEmail">Email or username:</label>
            <input
                type="text"
                id="signupEmail"
                placeholder="example@email.com"
            >
            <label for="signupPassword">Password:</label>
            <input
                type="password"
                id="signupPassword"
            >
            <button
                class="formButton signupButton"
                type="button"
                onclick="alert('You have been signed up! Login above!')">
                CONTINUE TO SIGN-UP
            </button>
        </div>
    </div>
    <footer>
        <div id="footerSection">
          <div id="contactUsSection">
            <h2 id="footerTitle" class="footerText">CONTACT US</h2>
            <p id="phoneNumber" class="footerText footerInfo">720-515-7839</p>
            <p id="email" class="footerText footerInfo">brAln.gainz@gmail.com</p>
          </div>
          <div id="socialsSection">
            <div id="faceboockCircle" class="social top">
              <img id="facebookIcon" class="socialIcon" src="facebook.png">
            </div>
            <div id="instagramCircle" class="social left">
              <img id="instagramIcon" class="socialIcon" src="instagram.png">
            </div>
            <div id="twitterCircle" class="social right">
              <img id="twitterIcon" class="socialIcon" src="twitter-alt.png">
            </div>
            <div id="linkedinCircle" class="social bottom">
              <img id="linkedinIcon" class="socialIcon" src="linkedin.png">
            </div>
          </div>
          <div id="logoSection">
            <img id="footerLogo" src="logo.png" alt="logo">
          </div>
        </div>
      </footer>
</body>
</html>
