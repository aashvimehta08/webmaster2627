<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div id="topSection">
        <h1 id="webText">BRAINGAINZ.EDU</h1>
        <button id="sourcesButton" type="button" onclick="window.location.href='sources.html'">REFERENCES</button>
        <button id="homeButton" type="button" onclick="window.location.href='home.html'">HOME</button>
    </div>

    <h1 id="pageTitle">
        <span id="loginTitle">Reset Password</span>
    </h1>

    <div class="formContainer">
        <form id="resetForm" class="formSection" novalidate>
            <label for="newPassword">New password:</label>
            <input type="password" id="newPassword" autocomplete="new-password"
                   placeholder="At least 8 characters, letters and numbers" required>
            <label for="confirmNewPassword">Confirm new password:</label>
            <input type="password" id="confirmNewPassword" autocomplete="new-password" required>
            <p id="resetMessage" class="formMessage" role="status" aria-live="polite">Checking your reset link…</p>
            <button class="formButton loginButton" type="submit" disabled>SAVE NEW PASSWORD</button>
        </form>
    </div>
    <script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
